services:
  screener-4h-d1:
    build:
      context: .
      dockerfile: Dockerfile.screener
    container_name: miro-screener-4h
    restart: unless-stopped
    env_file: .env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      - SCREENER_TIMEFRAME=4h
      - SCREENER_D1_MODE=d1_only
      - SCREENER_ML_THRESHOLD=0.25
      - SCREENER_MODEL_PATH=data/models/miro_gb_d1.joblib
      - SCREENER_STATE_FILE=data/state/screener_4h.json
    volumes:
      - screener_state:/app/data/state
      - ./data/models:/app/data/models:ro
    command: python scripts/run_screener.py

  screener-1h:
    build:
      context: .
      dockerfile: Dockerfile.screener
    container_name: miro-screener-1h
    restart: unless-stopped
    env_file: .env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      - SCREENER_TIMEFRAME=1h
      - SCREENER_D1_MODE=none
      - SCREENER_LEVEL_LOOKBACK=72
      - SCREENER_LEVEL_TOLERANCE_PCT=0.5
      - SCREENER_RETEST_WINDOW=6
      - SCREENER_MIN_LEVEL_AGE=6
      - SCREENER_TREND_SMA=20
      - SCREENER_RR_RATIO=2.0
      - SCREENER_ML_THRESHOLD=0.40
      - SCREENER_MODEL_PATH=data/models/miro_gb_1h_scalp.joblib
      - SCREENER_STATE_FILE=data/state/screener_1h.json
      - SCREENER_CANDLE_CLOSE_DELAY_SEC=15
    volumes:
      - screener_state:/app/data/state
      - ./data/models:/app/data/models:ro
    command: python scripts/run_screener.py

volumes:
  screener_state:
