# Strategy configuration — engine reads this at startup
# Enable/disable strategies and set parameters here

strategies:
  funding_capture:
    enabled: true
    type: event_driven
    allocation_pct: 10.0
    max_positions: 20
    params:
      threshold_bps: 10.0
      scan_threshold_bps: 5.0
      leverage: 10
      entry_seconds_before: 10
      exit_seconds_after: 15
      scan_interval_seconds: 300

  miro_breakout:
    enabled: false
    type: event_driven
    allocation_pct: 40.0
    max_positions: 3
    params:
      schedule: "4h"
      timeframe: "4h"
      vision_min_score: 8

  volume_ranking:
    enabled: false
    type: systematic
    allocation_pct: 50.0
    max_positions: 20
    params:
      schedule: "1d"
