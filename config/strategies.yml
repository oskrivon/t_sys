# Strategy configuration — engine reads this at startup
# Enable/disable strategies and set parameters here

strategies:
  funding_capture:
    enabled: false                   # paused for weekend 2026-05-22 → re-enable Monday
    type: event_driven
    allocation_pct: 10.0
    max_positions: 20
    params:
      threshold_bps: 25.0         # raised from 15: fees+slippage=$0.09/trade, need >=25bps to profit on $35
      scan_threshold_bps: 15.0    # pre-filter for WS watchlist (was 10)
      leverage: 10
      entry_seconds_before: 10    # precompute window (leverage+qty); order fires at T-2s
      exit_seconds_after: 30      # timeout safety net; normally exits on execType=Funding WS event
      scan_interval_seconds: 300
      min_volume_24h: 5000000     # $5M — filter out illiquid shitcoins
      target_notional: 0           # 0 = dynamic from balance (balance * balance_fraction)
      max_notional: 500.0         # safety cap
      balance_fraction: 0.9       # use 90% of free USDT balance
      max_spread_bps: 3.0         # tightened from 5: wide spread = slippage on exit (kills PnL)
      min_book_depth_mult: 5.0    # raised from 2: thin books = slippage trap (SPORTFUN lost $0.27)
      # Tokenized stock pairs — geo-restricted, fail at order execution
      blacklist: ["NVDA", "AAPL", "GOOGL", "MSFT", "TSLA", "AMZN", "COIN", "MSTR"]

  pairs_trading:
    enabled: false                   # paused for weekend 2026-05-22 → re-enable Monday + fix allocation bug
    type: event_driven
    allocation_pct: 0.0            # paper only — no real capital
    max_positions: 10              # 5 pairs × 2 legs
    params:
      schedule: "4h"
      z_entry: 2.0                 # enter when |z| > 2
      z_exit: 0.0                  # exit when z crosses 0
      z_stop: 4.0                  # stop if z diverges to 4
      lookback: 80                 # rolling window (80 × 4h = ~13 days)
      max_hold_candles: 120        # ~20 days timeout
      # pairs defined in code (OOS-validated top 5)

  miro_breakout:
    enabled: false
    type: event_driven
    allocation_pct: 40.0
    max_positions: 3
    params:
      schedule: "4h"
      timeframe: "4h"
      vision_min_score: 8

  volume_ranking:
    enabled: true
    type: systematic
    allocation_pct: 0.0          # paper only — no real capital allocated
    max_positions: 20
    params:
      schedule: "1d"
      short_window: 7
      long_window: 30
      top_pct: 0.5
