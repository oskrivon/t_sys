# Strategy configuration — engine reads this at startup
# Enable/disable strategies and set parameters here

strategies:
  funding_capture:
    enabled: true
    type: event_driven
    allocation_pct: 10.0
    max_positions: 20
    params:
      threshold_bps: 15.0         # optimal: 100% WR at 5.7 trades/day (backtest 81d)
      scan_threshold_bps: 10.0    # pre-filter for WS watchlist
      leverage: 10
      entry_seconds_before: 10    # precompute window (leverage+qty); order fires at T-2s
      exit_seconds_after: 30      # timeout safety net; normally exits on execType=Funding WS event
      scan_interval_seconds: 300
      min_volume_24h: 5000000     # $5M — filter out illiquid shitcoins
      target_notional: 25.0       # $25 per position
      min_book_depth_mult: 2.0    # skip if book level1 < 2x our notional

  miro_breakout:
    enabled: false
    type: event_driven
    allocation_pct: 40.0
    max_positions: 3
    params:
      schedule: "4h"
      timeframe: "4h"
      vision_min_score: 8

  volume_ranking:
    enabled: true
    type: systematic
    allocation_pct: 0.0          # paper only — no real capital allocated
    max_positions: 20
    params:
      schedule: "1d"
      short_window: 7
      long_window: 30
      top_pct: 0.5
