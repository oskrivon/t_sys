version: '3.8'

services:
  # TimescaleDB removed — was declared but never used by any code.
  # All state is in SQLite + Redis. Re-add when needed for time-series analytics.

  redis:
    image: redis:7-alpine
    container_name: trading-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Опционально: RedisInsight для визуализации
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: trading-redis-insight
    ports:
      - "8001:8001"
    depends_on:
      - redis

volumes:
  redis_data:
