name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short --timeout=30

      - name: Coverage report
        run: pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=30

  changes:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      screeners: ${{ steps.filter.outputs.screeners }}
      telegram: ${{ steps.filter.outputs.telegram }}
      paper: ${{ steps.filter.outputs.paper }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: filter
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          # Shared code used by ALL containers — rebuild everything
          if echo "$CHANGED" | grep -qE '^(src/core/|Dockerfile|pyproject.toml)'; then
            echo "engine=true" >> $GITHUB_OUTPUT
            echo "screeners=true" >> $GITHUB_OUTPUT
            echo "telegram=true" >> $GITHUB_OUTPUT
            echo "paper=true" >> $GITHUB_OUTPUT
            echo "scripts=true" >> $GITHUB_OUTPUT
          else
            # Engine: execution, strategies, engine, config
            if echo "$CHANGED" | grep -qE '^(src/engine/|src/execution/|src/strategies/|config/)'; then
              echo "engine=true" >> $GITHUB_OUTPUT
            else
              echo "engine=false" >> $GITHUB_OUTPUT
            fi

            # Screeners: screener, strategy (signals/levels/features), ai, run_screener
            if echo "$CHANGED" | grep -qE '^(src/screener/|src/strategy/|src/ai/|scripts/run_screener)'; then
              echo "screeners=true" >> $GITHUB_OUTPUT
            else
              echo "screeners=false" >> $GITHUB_OUTPUT
            fi

            # Telegram bot
            if echo "$CHANGED" | grep -qE '^(src/api/telegram/|scripts/run_telegram)'; then
              echo "telegram=true" >> $GITHUB_OUTPUT
            else
              echo "telegram=false" >> $GITHUB_OUTPUT
            fi

            # Paper trading
            if echo "$CHANGED" | grep -qE '^(src/paper_trading/|scripts/run_paper_trading)'; then
              echo "paper=true" >> $GITHUB_OUTPUT
            else
              echo "paper=false" >> $GITHUB_OUTPUT
            fi

            # Scripts/cron jobs: weekend, calendar (git pull only, no Docker rebuild)
            if echo "$CHANGED" | grep -qE '^(src/weekend/|src/calendar_signal/|scripts/)'; then
              echo "scripts=true" >> $GITHUB_OUTPUT
            else
              echo "scripts=false" >> $GITHUB_OUTPUT
            fi
          fi

  deploy:
    needs: [test, changes]
    runs-on: ubuntu-latest
    if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.screeners == 'true' || needs.changes.outputs.telegram == 'true' || needs.changes.outputs.paper == 'true' || needs.changes.outputs.scripts == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 180s
          script: |
            cd /root/trading
            git pull origin master
            SERVICES=""
            if [ "${{ needs.changes.outputs.engine }}" = "true" ]; then
              SERVICES="$SERVICES engine engine-binance"
            fi
            if [ "${{ needs.changes.outputs.screeners }}" = "true" ]; then
              SERVICES="$SERVICES screener-4h screener-1h"
            fi
            if [ "${{ needs.changes.outputs.telegram }}" = "true" ]; then
              SERVICES="$SERVICES telegram-bot"
            fi
            if [ "${{ needs.changes.outputs.paper }}" = "true" ]; then
              SERVICES="$SERVICES paper-trading"
            fi
            if [ -n "$SERVICES" ]; then
              docker compose -f docker-compose.platform.yml up -d --build --no-deps $SERVICES
            fi
