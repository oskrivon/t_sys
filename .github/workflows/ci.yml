name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short --timeout=30

      - name: Coverage report
        run: pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=30

  changes:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      screeners: ${{ steps.filter.outputs.screeners }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: filter
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          # Engine: core, execution, strategies, config, Dockerfile
          if echo "$CHANGED" | grep -qE '^(src/core/|src/execution/|src/strategies/|config/|Dockerfile|pyproject.toml)'; then
            echo "engine=true" >> $GITHUB_OUTPUT
          else
            echo "engine=false" >> $GITHUB_OUTPUT
          fi

          # Screeners: screener, strategy (signals/levels/features), ai
          if echo "$CHANGED" | grep -qE '^(src/screener/|src/strategy/|src/ai/|config/|Dockerfile|pyproject.toml)'; then
            echo "screeners=true" >> $GITHUB_OUTPUT
          else
            echo "screeners=false" >> $GITHUB_OUTPUT
          fi

          # Scripts/cron jobs: weekend, scripts (git pull only, no Docker rebuild)
          if echo "$CHANGED" | grep -qE '^(src/weekend/|scripts/|src/paper_trading/)'; then
            echo "scripts=true" >> $GITHUB_OUTPUT
          else
            echo "scripts=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: [test, changes]
    runs-on: ubuntu-latest
    if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.screeners == 'true' || needs.changes.outputs.scripts == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 180s
          script: |
            cd /root/trading
            git pull origin master
            SERVICES=""
            if [ "${{ needs.changes.outputs.engine }}" = "true" ]; then
              SERVICES="$SERVICES engine"
            fi
            if [ "${{ needs.changes.outputs.screeners }}" = "true" ]; then
              SERVICES="$SERVICES screener-4h screener-1h"
            fi
            if [ -n "$SERVICES" ]; then
              docker compose -f docker-compose.platform.yml up -d --build --no-deps $SERVICES
            fi
